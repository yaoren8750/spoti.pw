name: Build Deb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: brew install make dpkg ldid

      # 读取 flag 表
      - name: Flag table
        env:
          SG_FLAG_LIST: ${{ secrets.SG_FLAG_LIST }}
        run: |
          [ -n "$SG_FLAG_LIST" ] || { echo "::error::the SG_FLAG_LIST secret is not set"; exit 1; }
          echo "$SG_FLAG_LIST" | base64 -d | gunzip > tweak/Sources/Shared/Flags/SGFlagList.m

      - name: Build deb
        run: |
          env -u MAKELEVEL gmake -C tweak clean package

      # 保存 deb 到 Actions 构建产物
      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotifyglass-deb
          path: tweak/packages/*.deb
