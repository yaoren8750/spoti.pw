name: Build Deb

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deb:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable


      - name: Setup SDK
        run: |
          echo "THEOS_SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV


      - name: Install tools
        run: |
          brew install make dpkg ldid


      - name: Checkout Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive


      # 生成缺失的 SGFlagList.m
      - name: Create SGFlagList
        run: |
          mkdir -p tweak/Sources/Shared/Flags

          cat > tweak/Sources/Shared/Flags/SGFlagList.m <<'EOF'
          #import "Flags.h"

          const SGFlagDef SGFlagTable[] = {
          };

          const NSUInteger SGFlagCount = 0;
          EOF


      - name: Build deb
        run: |
          env -u MAKELEVEL gmake -C tweak clean package


      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: spotifyglass-deb
          path: tweak/packages/*.deb
          if-no-files-found: error
